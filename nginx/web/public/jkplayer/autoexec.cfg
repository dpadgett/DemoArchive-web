// ============================================================================
// OpenJK / jaMME Web Demo Player - autoexec.cfg
// ============================================================================
// Edit this file to customize UI, HUD, camera, and graphics cvar presets.
// Changes take effect immediately on page reload (no Wasm rebuild required),
// or live in the browser console via: JKDemoPlayer.reloadAutoexec()
// ============================================================================

// ----------------------------------------------------------------------------
// 2D HUD & UI Elements
// ----------------------------------------------------------------------------
set cg_draw2D "1"                   // Master 2D HUD toggle (1 = show HUD, 0 = hide all 2D UI)
set cg_drawStatus "1"               // Health, shield, force, and ammo status bars
set cg_drawScores "1"               // Score / team score boxes in lower-right
set cg_drawTimer "1"                // Match clock in upper-right (1 = show, 0 = hide)
set cg_drawFPS "0"                  // FPS counter in upper-right (1 = show, 0 = hide)
set cg_drawSpeed "0"                // Simple speed readout (1 = show, 0 = hide)
set cg_drawRadar "0"                // Radar / minimap in upper-right (1 = show, 0 = hide)
set cg_drawIcons "1"                // 2D HUD icons
set cg_draw3DIcons "1"              // 3D HUD models/icons
set cg_drawCrosshair "1"            // Crosshair style (0 = off, 1..9 = crosshair shader)
set cg_crosshairSize "24"           // Crosshair size in pixels
set cg_drawCrosshairNames "1"       // Show target player name when aiming at them
set cg_drawEnemyInfo "1"            // Show enemy info under crosshair
set cg_drawFriend "1"               // Show teammate indicator icon over friendly players
set cg_drawTeamOverlay "1"          // Team status overlay in upper-right (1 = show, 0 = hide)
set cg_drawRewards "0"              // Show reward medals
set cg_scorePlums "1"               // Floating score numbers
set cg_lagometer "0"                // Network lagometer graph (0 = off, 1 = on, 2 = with client prediction)
set cg_chatBox "10000"              // Chat message display duration in ms (0 = hide chat box)
set cg_chatBoxHeight "350"          // Chat box vertical position (0..480)
set cg_centerTime "3"               // Center-screen announcement duration in seconds (0 = off)
set cg_centerScale "1.0"            // Center-screen announcement text scale
set cg_hudFiles "ui/jahud.txt"      // HUD definition file

// ----------------------------------------------------------------------------
// jaMME & Competitive HUD Overlays
// ----------------------------------------------------------------------------
set mov_ratioFix "1"                // Widescreen 2D HUD aspect correction (1 = 4:3 HUD elements, 0 = stretched)
set mov_drawFollow "2"              // Spectator/demo "Following" banner (0 = hide, 1 = default, 2 = compact)
set mov_saberTeamColour "1"         // Force team-colored sabers in CTF/TFFA (1 = on, 0 = off)
set mov_duelShell "1"               // Show duel isolation shell effect (1 = on, 0 = off)
set mov_chatBeep "1"                // Play beep sound on chat messages (1 = on, 0 = off)
set cg_speedometer "0"              // Speedometer bitmask (0 = off, 1 = speed, 2 = jump height, 4 = jump distance)
set cg_speedometerSize "0.75"       // Speedometer scale
set cg_movementKeys "0"             // On-screen WASD / movement key press overlay (0 = off, 1 = on)
set cg_movementKeysSize "1.0"       // Movement keys overlay scale
set cg_strafeHelper "0"             // Strafe helper overlay (0 = off, >0 = bitmask style)
set cg_drawPlayerNames "0"          // Overhead player names in 3D world (0 = off, 1 = on)

// ----------------------------------------------------------------------------
// Camera, FOV & View
// ----------------------------------------------------------------------------
set cg_fov "80"                     // Field of view in degrees (e.g. 80, 90, 95, 100, 110)
set cg_fovAspectAdjust "1"          // Hor+ automatic widescreen FOV scaling (1 = on, 0 = off)
set cg_thirdPerson "1"              // Camera view (1 = third-person, 0 = first-person)
set cg_thirdPersonRange "80"        // Third-person camera distance (default 80)
set cg_thirdPersonVertOffset "16"   // Third-person camera vertical offset (default 16)
set cg_thirdPersonPitchOffset "0"   // Third-person camera pitch offset
set cg_thirdPersonAngle "0"         // Third-person camera yaw angle offset
set cg_drawGun "1"                  // Draw first-person weapon viewmodel (1 = show, 0 = hide)

// ----------------------------------------------------------------------------
// Items, Models & Graphics Presets
// ----------------------------------------------------------------------------
set cg_simpleItems "1"              // Map pickups/weapons (1 = 2D simple icons, 0 = 3D spinning models)
set cg_shadows "1"                  // Entity shadows (0 = off, 1 = simple blob)
set cg_marks "1"                    // Impact marks / scorch decals on walls (1 = on, 0 = off)
set cg_saberTrail "1"               // Saber blade trail (1 = on, 0 = off)
set cg_auraShell "1"                // Force power aura shells (1 = on, 0 = off)
set cg_repeaterOrb "0"              // Alternative repeater alt-fire orb effect (0 = default, 1 = sphere)
set r_dynamiclight "1"              // Dynamic lighting (1 = on, 0 = off)
set r_drawfog "0"                   // Level fog (0 = off, 1 = on)
set r_noportals "1"                 // Portal/skybox culling (1 = skip portal camera, 0 = render portals)
set r_picmip "0"                    // Texture resolution (0 = max quality, 1 = medium, 2 = low, 3 = very low)
set r_lodbias "0"                   // Model geometric LOD (0 = highest detail, 1 = medium, 2 = low)
set r_subdivisions "4"              // Bezier curve smoothness (4 = smooth, 20 = coarse)
set r_detailtextures "1"            // Detail textures (1 = on, 0 = off)
set r_textureMode "GL_LINEAR_MIPMAP_NEAREST"
